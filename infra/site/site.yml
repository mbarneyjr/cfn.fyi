AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::LanguageExtensions
Description: Frontend infrastructure for site hosting


Parameters:
  ApplicationName:
    Type: String
    Description: The name of the application
  EnvironmentName:
    Type: String
    Description: The name of the environment
  HostedZoneId:
    Type: String
  DomainName:
    Type: String
  CodeBucket:
    Type: String
    Description: Versioned S3 bucket that contains the site deployment package
  CodeKey:
    Type: String
    Description: S3 key of the site deployment package
  CodeVersion:
    Type: String
    Description: S3 object version of the site deployment package
  SlackIconUri:
    Type: String
    Description: s3:// URI of the Slack app icon


Conditions:
  IsProduction: !Equals [!Ref EnvironmentName, prod]


Resources:
  ArchiveBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ArchiveBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: IsProduction
    Properties:
      Bucket: !Ref ArchiveBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyArchiveDeletion
            Effect: Deny
            Principal: '*'
            Action:
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:PutBucketVersioning
            Resource:
              - !GetAtt ArchiveBucket.Arn
              - !Sub ${ArchiveBucket.Arn}/*

  DatabaseCluster:
    Type: AWS::DSQL::Cluster
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      DeletionProtectionEnabled: !If [IsProduction, true, false]
      Tags:
        - Key: Name
          Value: !Sub ${ApplicationName}-${EnvironmentName}

  SlackCredentials:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub Credentials of the ${ApplicationName}-${EnvironmentName} Slack app, written by the Slack::Apps::App provider

  SlackApp:
    Type: Slack::Apps::App
    Properties:
      CredentialsSecretId: !Ref SlackCredentials
      Icon: !Ref SlackIconUri
      Manifest:
        DisplayInformation:
          Name: !Sub
            - cfn.fyi${Suffix}
            - Suffix: !If [IsProduction, '', !Sub ' (${EnvironmentName})']
          Description: Notifications for new CloudFormation resource specification versions.
        Features:
          BotUser:
            DisplayName: cfn.fyi
        OauthConfig:
          RedirectUrls:
            - !Sub https://${DomainName}/slack/oauth/callback
            - !If [IsProduction, !Ref AWS::NoValue, http://localhost:44100/slack/oauth/callback]
          Scopes:
            Bot:
              - incoming-webhook
              - chat:write
              - chat:write.public
        Settings:
          EventSubscriptions:
            RequestUrl: !Sub https://${DomainName}/slack/events
            BotEvents:
              - app_uninstalled
              - tokens_revoked
          OrgDeployEnabled: false
          SocketModeEnabled: false
          TokenRotationEnabled: false

  SiteFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: database
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dsql:DbConnect
                Resource: !GetAtt DatabaseCluster.ResourceArn

  SiteFunction:
    Type: AWS::Lambda::WebFunction
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - E3006
    Properties:
      FunctionName: !Sub ${ApplicationName}-${EnvironmentName}-site

  SiteFunctionRevision:
    Type: AWS::Lambda::WebFunctionRevision
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - E3006
    DependsOn: SiteFunction
    Properties:
      FunctionName: !Sub ${ApplicationName}-${EnvironmentName}-site
      BuildConfig:
        CodeConfig:
          S3Object:
            Bucket: !Ref CodeBucket
            Key: !Ref CodeKey
            VersionId: !Ref CodeVersion
        RuntimeConfig:
          Runtime: nodejs24.x
      ServiceConfig:
        ExecutionRoleArn: !GetAtt SiteFunctionRole.Arn
        TimeoutSeconds: 60
        EnvironmentVariables:
          NODE_ENV: production
          NODE_OPTIONS: --import remix/node-tsx
          ENVIRONMENT_NAME: !Ref EnvironmentName
          AWS_LAMBDA_NODEJS_ENTRYPOINT: packages/site/server.ts
          DATABASE_ENDPOINT: !Sub ${DatabaseCluster.Identifier}.dsql.${AWS::Region}.on.aws
          DATABASE_USER: cfnfyi_reader
          SLACK_CLIENT_ID: !GetAtt SlackApp.ClientId
          SLACK_AUTHORIZE_URL: !GetAtt SlackApp.OauthAuthorizeUrl
          SLACK_CLIENT_SECRET: !Sub '{{resolve:secretsmanager:${SlackCredentials}:SecretString:ClientSecret}}'
          SLACK_SIGNING_SECRET: !Sub '{{resolve:secretsmanager:${SlackCredentials}:SecretString:SigningSecret}}'
          SLACK_SCOPES: !Join [',', !GetAtt SlackApp.BotScopes]

  SiteFunctionEndpoint:
    Type: AWS::Lambda::WebFunctionEndpoint
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - E3006
    DependsOn: SiteFunction
    Properties:
      FunctionName: !Sub ${ApplicationName}-${EnvironmentName}-site
      EndpointName: primary
      EndpointType: HomeRegion
      AuthType: IamAuth
      RevisionWeights:
        - RevisionId: !GetAtt SiteFunctionRevision.RevisionId
          Weight: 100

  SiteFunctionPolicy:
    Type: AWS::Lambda::ResourcePolicy
    Properties:
      ResourceArn: !GetAtt SiteFunctionEndpoint.FunctionArn
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOACAccess
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: lambda:InvokeWebFunctionEndpoint
            Resource: !GetAtt SiteFunctionEndpoint.EndpointArn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${ApplicationName}-${EnvironmentName}-site
        OriginAccessControlOriginType: lambda
        SigningBehavior: always-amz-auth
        SigningProtocol: sigv4

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub ${DomainName}
      SubjectAlternativeNames:
        - !Sub '*.${DomainName}'
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${ApplicationName}-${EnvironmentName}-${DomainName}
        HttpVersion: http2
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2019
        Origins:
          - Id: primary
            DomainName: !GetAtt SiteFunctionEndpoint.DomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginReadTimeout: 60
        CacheBehaviors:
          - PathPattern: /slack/events
            TargetOriginId: primary
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # caching disabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # all viewer except host header
        DefaultCacheBehavior:
          TargetOriginId: primary
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: !Ref SiteCachePolicy
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # all viewer except host header

  SiteCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ${ApplicationName}-${EnvironmentName}-site
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: all

  SiteLogGroup:
    Type: AWS::Logs::LogGroup
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub ${ApplicationName}-${EnvironmentName}-cloudfront-logs
  SiteLogDeliverySource:
    Type: AWS::Logs::DeliverySource
    Properties:
      Name: !Sub ${ApplicationName}-${EnvironmentName}-cloudfront
      LogType: ACCESS_LOGS
      ResourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}
  SiteLogDeliveryDestination:
    Type: AWS::Logs::DeliveryDestination
    Properties:
      Name: !Sub ${ApplicationName}-${EnvironmentName}-cloudfront-logs
      OutputFormat: json
      DestinationResourceArn: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${SiteLogGroup}
  SiteLogDelivery:
    Type: AWS::Logs::Delivery
    Properties:
      DeliverySourceName: !Ref SiteLogDeliverySource
      DeliveryDestinationArn: !GetAtt SiteLogDeliveryDestination.Arn

  EventFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: events
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${ArchiveBucket.Arn}/*
              - Effect: Allow
                Action: dsql:DbConnect
                Resource: !GetAtt DatabaseCluster.ResourceArn
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ApplicationName}-${EnvironmentName}-rebuild-changes
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  - !GetAtt VersionReadyQueue.Arn
                  - !GetAtt DeliveryQueue.Arn

  SynchronizeArchiveFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ApplicationName}-${EnvironmentName}-synchronize-archive
      Runtime: nodejs24.x
      Architectures:
        - arm64
      Handler: packages/site/app/events/schedule/synchronize-archive/handler.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
        S3ObjectVersion: !Ref CodeVersion
      Role: !GetAtt EventFunctionRole.Arn
      MemorySize: 1024
      Timeout: 600
      LoggingConfig:
        LogFormat: JSON
      Environment:
        Variables:
          NODE_ENV: production
          NODE_OPTIONS: --import remix/node-tsx
          ENVIRONMENT_NAME: !Ref EnvironmentName
          ARCHIVE_BUCKET: !Ref ArchiveBucket
          DATABASE_ENDPOINT: !Sub ${DatabaseCluster.Identifier}.dsql.${AWS::Region}.on.aws
          DATABASE_USER: cfnfyi_writer
          REBUILD_FUNCTION_NAME: !Ref RebuildChangesFunction

  RebuildChangesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ApplicationName}-${EnvironmentName}-rebuild-changes
      Runtime: nodejs24.x
      Architectures:
        - arm64
      Handler: packages/site/app/events/schedule/rebuild-changes/handler.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
        S3ObjectVersion: !Ref CodeVersion
      Role: !GetAtt EventFunctionRole.Arn
      MemorySize: 2048
      Timeout: 900
      LoggingConfig:
        LogFormat: JSON
      Environment:
        Variables:
          NODE_ENV: production
          NODE_OPTIONS: --import remix/node-tsx
          ENVIRONMENT_NAME: !Ref EnvironmentName
          ARCHIVE_BUCKET: !Ref ArchiveBucket
          DATABASE_ENDPOINT: !Sub ${DatabaseCluster.Identifier}.dsql.${AWS::Region}.on.aws
          DATABASE_USER: cfnfyi_writer
          DISTRIBUTION_ID: !Ref SiteDistribution
          VERSION_READY_QUEUE_URL: !Ref VersionReadyQueue

  VersionReadyDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  VersionReadyQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt VersionReadyDeadLetterQueue.Arn
        maxReceiveCount: 3

  EnumerateSubscribersFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ApplicationName}-${EnvironmentName}-enumerate-subscribers
      Runtime: nodejs24.x
      Architectures:
        - arm64
      Handler: packages/site/app/events/queue/enumerate-subscribers/handler.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
        S3ObjectVersion: !Ref CodeVersion
      Role: !GetAtt EventFunctionRole.Arn
      MemorySize: 512
      Timeout: 60
      LoggingConfig:
        LogFormat: JSON
      Environment:
        Variables:
          NODE_ENV: production
          NODE_OPTIONS: --import remix/node-tsx
          ENVIRONMENT_NAME: !Ref EnvironmentName
          DATABASE_ENDPOINT: !Sub ${DatabaseCluster.Identifier}.dsql.${AWS::Region}.on.aws
          DATABASE_USER: cfnfyi_writer
          DELIVERY_QUEUE_URL: !Ref DeliveryQueue

  EnumerateSubscribersEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt VersionReadyQueue.Arn
      FunctionName: !Ref EnumerateSubscribersFunction
      BatchSize: 10
      FunctionResponseTypes:
        - ReportBatchItemFailures

  DeliveryDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  DeliveryQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 5400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeliveryDeadLetterQueue.Arn
        maxReceiveCount: 3

  SendNotificationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ApplicationName}-${EnvironmentName}-send-notification
      Runtime: nodejs24.x
      Architectures:
        - arm64
      Handler: packages/site/app/events/queue/send-notification/handler.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
        S3ObjectVersion: !Ref CodeVersion
      Role: !GetAtt EventFunctionRole.Arn
      MemorySize: 512
      Timeout: 900
      LoggingConfig:
        LogFormat: JSON
      Environment:
        Variables:
          NODE_ENV: production
          NODE_OPTIONS: --import remix/node-tsx
          ENVIRONMENT_NAME: !Ref EnvironmentName
          DATABASE_ENDPOINT: !Sub ${DatabaseCluster.Identifier}.dsql.${AWS::Region}.on.aws
          DATABASE_USER: cfnfyi_writer
          SITE_URL: !Sub https://${DomainName}

  SendNotificationEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt DeliveryQueue.Arn
      FunctionName: !Ref SendNotificationFunction
      BatchSize: 1
      FunctionResponseTypes:
        - ReportBatchItemFailures

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt SynchronizeArchiveFunction.Arn
                  - !GetAtt RebuildChangesFunction.Arn

  SynchronizeArchiveSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub ${ApplicationName}-${EnvironmentName}-synchronize-archive
      ScheduleExpression: rate(1 minute)
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt SynchronizeArchiveFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 0

  RebuildChangesSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub ${ApplicationName}-${EnvironmentName}-rebuild-changes
      ScheduleExpression: rate(1 day)
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt RebuildChangesFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn

  SiteDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      Type: A
      AliasTarget:
        DNSName: !Sub ${SiteDistribution.DomainName}
        HostedZoneId: Z2FDTNDATAQYW2
      Name: !Ref DomainName
      HostedZoneId: !Ref HostedZoneId

  SiteErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub ${ApplicationName}-${EnvironmentName}-site-error-rate
      AlarmDescription: More than 5 percent of site requests return a 5xx response
      Namespace: AWS/CloudFront
      MetricName: 5xxErrorRate
      Dimensions:
        - Name: DistributionId
          Value: !Ref SiteDistribution
        - Name: Region
          Value: Global
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      ComparisonOperator: GreaterThanThreshold
      Threshold: 5
      TreatMissingData: notBreaching

  VersionReadyDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub ${ApplicationName}-${EnvironmentName}-version-ready-dead-letters
      AlarmDescription: A ready version failed subscriber enumeration and moved to the dead-letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt VersionReadyDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      TreatMissingData: notBreaching

  DeliveryDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub ${ApplicationName}-${EnvironmentName}-delivery-dead-letters
      AlarmDescription: A notification delivery failed before its claim and moved to the dead-letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeliveryDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      TreatMissingData: notBreaching

  RebuildErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub ${ApplicationName}-${EnvironmentName}-rebuild-errors
      AlarmDescription: The rebuild failed, so pending versions stay hidden until the next rebuild
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RebuildChangesFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      TreatMissingData: notBreaching

  RebuildDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub ${ApplicationName}-${EnvironmentName}-rebuild-duration
      AlarmDescription: The rebuild used more than 80 percent of its 900 second timeout
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref RebuildChangesFunction
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 720000
      TreatMissingData: notBreaching

  SynchronizeErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub ${ApplicationName}-${EnvironmentName}-synchronize-errors
      AlarmDescription: The synchronize failed in each of the last 15 minutes, so new versions are not archived
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SynchronizeArchiveFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      TreatMissingData: notBreaching

  SynchronizeInvocationAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub ${ApplicationName}-${EnvironmentName}-synchronize-not-running
      AlarmDescription: The synchronize schedule did not invoke the function in the last 15 minutes
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref SynchronizeArchiveFunction
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      ComparisonOperator: LessThanThreshold
      Threshold: 1
      TreatMissingData: breaching

  DeliveryBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub ${ApplicationName}-${EnvironmentName}-delivery-backlog
      AlarmDescription: The oldest notification delivery has waited more than one hour
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeliveryQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 3600
      TreatMissingData: notBreaching


Outputs:
  SiteUrl:
    Description: URL of the site
    Value: !Sub https://${DomainName}/
  DistributionId:
    Description: ID of the CloudFront distribution
    Value: !Ref SiteDistribution
  ArchiveBucketName:
    Description: Versioned bucket that holds every archived specification revision
    Value: !Ref ArchiveBucket
  DatabaseEndpoint:
    Description: Endpoint of the DSQL cluster
    Value: !Sub ${DatabaseCluster.Identifier}.dsql.${AWS::Region}.on.aws
  SiteFunctionRoleArn:
    Description: Role that the database maps to cfnfyi_reader
    Value: !GetAtt SiteFunctionRole.Arn
  EventFunctionRoleArn:
    Description: Role that the database maps to cfnfyi_writer
    Value: !GetAtt EventFunctionRole.Arn
  RebuildChangesFunctionName:
    Description: Function that rebuilds the changes from the archive
    Value: !Ref RebuildChangesFunction
